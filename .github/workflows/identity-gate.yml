name: CI - Commit Identity Gate

# Reusable: other Ionrift repos call this with
#   uses: ionrift-gm/ionrift-ci/.github/workflows/identity-gate.yml@main
on:
  workflow_call:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  identity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: verify commit identity
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ALLOWED="ionrift.gm@gmail.com"
          ZERO="0000000000000000000000000000000000000000"

          if [ "$EVENT" = "pull_request" ]; then
            set -- "$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            set -- "$BEFORE..HEAD"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            set -- HEAD --not "origin/$DEFAULT_BRANCH"
          else
            set -- -1 HEAD
          fi

          FAILED=0
          for sha in $(git rev-list "$@"); do
            short=$(git rev-parse --short "$sha")
            ae=$(git log -1 --format='%ae' "$sha")
            ce=$(git log -1 --format='%ce' "$sha")
            if [ "$ae" != "$ALLOWED" ]; then
              echo "::error::Commit $short: author email is not the Ionrift address."
              FAILED=1
            fi
            if [ "$ce" != "$ALLOWED" ] && [ "$ce" != "noreply@github.com" ]; then
              echo "::error::Commit $short: committer email is not the Ionrift address."
              FAILED=1
            fi
            if git log -1 --format='%B' "$sha" | grep -qiE '^[[:space:]]*co-authored-by[[:space:]]*:'; then
              echo "::error::Commit $short: message contains a Co-authored-by trailer."
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Identity gate failed."
            exit 1
          fi
          echo "All commits pass the identity gate."
