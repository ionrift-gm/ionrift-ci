# =============================================================================
# Reusable Workflow: notify-discord-changelog.yml
# Repository: ionrift-gm/ionrift-ci
#
# Posts a Keep-a-Changelog entry to Discord. Used by module releases and
# overlay pack releases. Skips ## [Unreleased]. Missing webhook warns and exits
# 0 unless fail_without_webhook is true.
# =============================================================================
name: Reusable Discord Changelog Notify

on:
  workflow_call:
    inputs:
      changelog_path:
        description: "Path to CHANGELOG.md or per-overlay changelog file."
        type: string
        default: "CHANGELOG.md"
      title_prefix:
        description: "Embed title prefix before \" - v{version}\"."
        type: string
        required: true
      embed_color:
        description: "Discord embed color as a base-10 integer."
        type: string
        default: "2859969"
      embed_url:
        description: "Optional embed URL. Empty uses the repo homepage."
        type: string
        default: ""
      thumbnail_url:
        description: "Optional thumbnail URL. Empty omits thumbnail."
        type: string
        default: ""
      dry_run:
        description: "Append (dry run) to the title."
        type: boolean
        default: false
      fail_without_webhook:
        description: "Fail the job when DISCORD_WEBHOOK_URL is unset."
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook URL (typically #patch-notes)."
        required: false

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post changelog embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TITLE_PREFIX: ${{ inputs.title_prefix }}
          DISCORD_EMBED_COLOR: ${{ inputs.embed_color }}
          DISCORD_EMBED_URL: ${{ inputs.embed_url }}
          DISCORD_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          DRY_RUN: ${{ inputs.dry_run }}
          FAIL_WITHOUT_WEBHOOK: ${{ inputs.fail_without_webhook }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.CHANGELOG_PATH || 'CHANGELOG.md';
            if (!fs.existsSync(path)) {
              core.setFailed(`Changelog not found: ${path}`);
              return;
            }
            const changelog = fs.readFileSync(path, 'utf8');
            const versionMatch = changelog.match(/^## \[(?!Unreleased\])([^\]]+)\]/m);
            if (!versionMatch) {
              core.setFailed(`No version heading found in ${path} (expected ## [x.y.z], skipping Unreleased)`);
              return;
            }
            const version = versionMatch[1];
            const lines = changelog.split('\n');
            const body = [];
            let found = false;
            for (const line of lines) {
              if (line.startsWith('## ')) {
                if (found) break;
                if (/^## \[Unreleased\]/i.test(line)) continue;
                if (line.startsWith(`## [${version}]`)) {
                  found = true;
                  continue;
                }
                continue;
              }
              if (found) {
                if (line.startsWith('### ')) {
                  body.push('', `**${line.slice(4)}**`);
                } else {
                  body.push(line);
                }
              }
            }
            let desc = body.join('\n').trim();
            if (!desc) {
              core.setFailed(`Empty changelog body for v${version} in ${path}`);
              return;
            }
            if (desc.length > 3900) {
              desc = desc.slice(0, 3900) + '\n\n_see full notes on GitHub_';
            }
            const prefix = process.env.DISCORD_TITLE_PREFIX || 'Ionrift';
            const color = parseInt(process.env.DISCORD_EMBED_COLOR || '0', 10);
            const thumb = (process.env.DISCORD_THUMBNAIL_URL || '').trim();
            const dry = process.env.DRY_RUN === 'true';
            const embedUrl = (process.env.DISCORD_EMBED_URL || '').trim()
              || `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            const embed = {
              title: dry ? `${prefix} - v${version} (dry run)` : `${prefix} - v${version}`,
              description: desc,
              color,
              url: embedUrl
            };
            if (thumb) embed.thumbnail = { url: thumb };
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) {
              if (process.env.FAIL_WITHOUT_WEBHOOK === 'true') {
                core.setFailed('DISCORD_WEBHOOK_URL secret is not set');
              } else {
                core.warning('DISCORD_WEBHOOK_URL secret is not set - skipping Discord notification');
              }
              return;
            }
            const resp = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embeds: [embed] })
            });
            if (!resp.ok) {
              const t = await resp.text();
              core.setFailed(`Discord webhook failed (${resp.status}): ${t}`);
            } else {
              console.log(`Discord notification posted for ${prefix} v${version}`);
            }
