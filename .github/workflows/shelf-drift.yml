name: Module Shelf Drift Check

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    name: Check Shelf vs GitHub releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ionrift-ci
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare GitHub releases against registry.json and /packs/status
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.IONRIFTGM_GIT_TOKEN || secrets.IONRIFT_CI_PAT || github.token }}
          HAS_CROSS_REPO_TOKEN: ${{ secrets.IONRIFTGM_GIT_TOKEN != '' || secrets.IONRIFT_CI_PAT != '' }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const cfgPath = path.resolve("config/shelf-modules.json");
          const { modules } = JSON.parse(fs.readFileSync(cfgPath, "utf8"));
          const token = (process.env.READ_TOKEN || "").trim();
          const hasCrossRepoToken = String(process.env.HAS_CROSS_REPO_TOKEN || "").trim() === "true";

          const STATUS_URL = "https://api.ionrift.cloud/packs/status";
          const REGISTRY_URL = "https://raw.githubusercontent.com/ionrift-gm/ionrift-pack-registry/main/registry.json";

          async function fetchJson(url, headers = {}) {
            const res = await fetch(url, {
              headers: {
                "user-agent": "ionrift-shelf-drift-check",
                "accept": "application/json",
                ...headers
              }
            });
            if (!res.ok) {
              throw new Error(`HTTP ${res.status} from ${url}`);
            }
            return res.json();
          }

          async function fetchLatestRelease(repo) {
            const headers = { "accept": "application/vnd.github+json" };
            if (token) headers["authorization"] = `Bearer ${token}`;
            const res = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=10`, {
              headers: {
                "user-agent": "ionrift-shelf-drift-check",
                ...headers
              }
            });
            if (!res.ok) {
              if (res.status === 404 && !hasCrossRepoToken) {
                return {
                  ok: false,
                  skipped: true,
                  version: "pending cross-repo token"
                };
              }
              return { ok: false, skipped: false, version: `error (HTTP ${res.status})` };
            }
            const list = await res.json();
            const rel = Array.isArray(list)
              ? list.find((r) => r && !r.draft && typeof r.tag_name === "string" && r.tag_name.length > 0)
              : null;
            if (!rel) {
              return { ok: false, skipped: false, version: "none" };
            }
            return {
              ok: true,
              skipped: false,
              tag: rel.tag_name,
              version: rel.tag_name.replace(/^v/, "")
            };
          }

          (async () => {
            const statusData = await fetchJson(STATUS_URL);
            const statusMap = new Map((statusData.modules || []).map((m) => [m.id, m.latest]));

            const registryData = await fetchJson(REGISTRY_URL);
            const registryModules = registryData.modules || {};

            const rows = [];
            let drifted = false;
            let skippedPrivate = false;

            for (const mod of modules) {
              const gh = await fetchLatestRelease(mod.repo);
              const regEntry = registryModules[mod.id] || {};
              const regLatest = regEntry.earlyAccess?.version || regEntry.latest || "missing";
              const apiLatest = statusMap.get(mod.id) || "missing";

              const shelfAligned = regLatest !== "missing" && regLatest === apiLatest;
              const aligned = gh.skipped
                ? shelfAligned
                : gh.ok && gh.version === regLatest && gh.version === apiLatest;

              if (gh.skipped) skippedPrivate = true;
              if (!aligned) drifted = true;

              rows.push({
                id: mod.id,
                github: gh.ok ? `${gh.version} (${gh.tag})` : gh.version,
                registry: regLatest,
                statusApi: apiLatest,
                state: !aligned ? "DRIFT" : gh.skipped ? "OK (Shelf aligned)" : "OK"
              });
            }

            const lines = [
              "## Module Shelf Release Drift Check",
              "",
              "| Module | Latest GitHub Release | `registry.json` (`main`) | Live `/packs/status` | State |",
              "| :--- | :--- | :--- | :--- | :--- |",
              ...rows.map((r) => `| \`${r.id}\` | \`${r.github}\` | \`${r.registry}\` | \`${r.statusApi}\` | **${r.state}** |`),
              ""
            ];

            const report = lines.join("\n");
            console.log(report);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + "\n", "utf8");
            }

            if (skippedPrivate) {
              console.warn("::warning::Private module release tags were skipped because the cross-repo token secret is not configured yet; verified registry.json matches live /packs/status.");
            }

            if (drifted) {
              console.error("::error::One or more Shelf-delivered modules are out of sync.");
              process.exit(1);
            }
          })().catch((err) => {
            console.error(`::error::Shelf drift check failed: ${err.message}`);
            process.exit(1);
          });
          EOF
