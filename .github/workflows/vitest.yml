# =============================================================================
# Reusable Workflow: vitest.yml
# Repository: ionrift-gm/ionrift-ci
# Called as:  ionrift-gm/ionrift-ci/.github/workflows/vitest.yml@main
#
# Covers: Headless Vitest unit tests. No Foundry runtime required.
# Used by: ionrift-library, ionrift-respite, ionrift-quartermaster, ionrift-resonance.
# =============================================================================
name: Unit Tests (Vitest)

on:
  workflow_call:
    inputs:
      vitest_command:
        description: 'Command to run Vitest (default: npm test)'
        type: string
        default: 'npm test'
      testharness_repo:
        description: 'Private repo containing test files (optional). If set, tests run from here instead of the calling repo.'
        type: string
        default: ''
      testharness_config:
        description: 'Vitest config path relative to the testharness checkout (required if testharness_repo is set).'
        type: string
        default: ''
      sibling_repos:
        description: 'Space-separated repos checked out inside the workspace (ionrift-gm/ionrift-library).'
        type: string
        default: ''
    secrets:
      CI_PAT:
        description: 'PAT with read access to the testharness repo (required if testharness_repo is set).'
        required: false

jobs:

  # -----------------------------------------------------------------------------
  # JOB 1 - Unit Tests (Vitest)
  # -----------------------------------------------------------------------------
  vitest:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout testharness
        if: inputs.testharness_repo != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.testharness_repo }}
          token: ${{ secrets.CI_PAT }}
          path: .testharness

      - name: Checkout sibling repos
        if: inputs.sibling_repos != ''
        env:
          SIBLING_REPOS: ${{ inputs.sibling_repos }}
          CI_PAT: ${{ secrets.CI_PAT }}
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            name="${repo##*/}"
            rm -rf "$name"
            cloned=0
            if git clone --depth 1 "https://github.com/${repo}.git" "$name" >/dev/null 2>&1; then
              cloned=1
            elif [ -n "${CI_PAT:-}" ]; then
              auth=$(printf 'x-access-token:%s' "$CI_PAT" | base64 -w 0)
              if git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                clone --depth 1 "https://github.com/${repo}.git" "$name" >/dev/null 2>&1; then
                cloned=1
              fi
            fi
            if [ "$cloned" -ne 1 ]; then
              rm -rf "$name"
              echo "Sibling checkout failed: ${name} is not available."
              exit 1
            fi
            echo "Checked out ${name}."
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies (module)
        run: npm install

      - name: Install dependencies (testharness)
        if: inputs.testharness_repo != ''
        working-directory: .testharness
        run: npm install

      - name: Run Vitest (from testharness)
        if: inputs.testharness_repo != ''
        working-directory: .testharness
        env:
          MODULE_ROOT: ${{ github.workspace }}
        run: npx vitest run --config ${{ inputs.testharness_config }}

      - name: Run Vitest (from module)
        if: inputs.testharness_repo == ''
        run: ${{ inputs.vitest_command }}
